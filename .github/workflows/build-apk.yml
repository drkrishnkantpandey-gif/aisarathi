name: Build AI Sarathi APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Sarathi-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Create GitHub Release with APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-phase1
        name: "AI Sarathi Phase 1 - Ready to Install"
        body: |
          ### AI Sarathi - Native Android Car Infotainment Launcher (Phase 1)
          
          **Tested for:** Redmi 10 (MIUI 14 / Android 12-13)
          
          **Download and install:**
          1. Download the `app-debug.apk` file below directly onto your Redmi 10.
          2. Tap to Install (Allow install unknown apps if prompted).
          3. Open **AI Sarathi** and set it as your Default Home Launcher.
          4. Open Settings in the app, paste your Gemini API key, and you are ready!
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
